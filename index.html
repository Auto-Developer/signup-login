<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup page</title>
    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/index.js" defer></script>
    <script src="js/practice.js" defer></script>
</head>
<body>
    <div class="grid lg:grid-cols-2 w-10/12 mx-auto gap-16 h-screen">
        <div class="flex items-center">
            <img src="images/sign-up.png" alt="sign-up" class="w-full">
        </div>
        <div class="lg:py-16">
            <h1 class="text-5xl font-bold lg:text-left text-center">Register Now !</h1>
            <form class="lg:mt-16 mt-12 space-y-8">
                <div class="flex flex-col gap-2">
                    <label class="text-lg text-gray-600">Fullname</label>
                    <input name="fullname" type="text" placeholder="What is your name?" class="border border-gray-500 px-3 py-2.5 rounded">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-lg text-gray-600">Email id</label>
                    <input name="email" type="email" placeholder="example@gmail.com" class="border border-gray-500 px-3 py-2.5 rounded">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-lg text-gray-600">Password</label>
                    <input name="password" type="password" placeholder="********" class="border border-gray-500 px-3 py-2.5 rounded">
                </div>

                <button class="bg-[#F50057] hover:bg-[#3F3D56] px-6 py-2.5 rounded text-white">Sign up</button>
            </form>
        </div>
    </div>
</body>
</html>
